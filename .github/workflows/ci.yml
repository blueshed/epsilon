# The contract, on every change: tsc strict, then every suite bottom-up —
# unit/wire/DOM, migrations, Postgres durability + relational, and the real
# app in a real browser. Mirrors `bun run ci` with a service container
# standing in for compose.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: epsilon
          POSTGRES_PASSWORD: epsilon
          POSTGRES_DB: epsilon
        ports:
          - 5599:5432
        options: >-
          --health-cmd "pg_isready -U epsilon"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest # Bun.WebView needs ≥ 1.3.14
      - run: bun install
      - run: bun run check
      - run: bun run test
      - run: bun run test:migrate
      - run: bun run test:pg
      - run: bun run test:app
        env:
          BUN_CHROME_PATH: /usr/bin/google-chrome # preinstalled on the runner
