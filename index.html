<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>epsilon-app</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text x='2' y='13' font-size='14' font-family='monospace' fill='%230e9384'>ε</text></svg>" />
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <header>
      <h1>epsilon</h1>
      <button id="settings-link" hidden>settings</button>
      <button id="signout" hidden>sign out</button>
    </header>

    <section id="mine" hidden>
      <form id="board-form"><input id="new-board" placeholder="new board name, press enter" /></form>
      <ul id="boards"></ul>
      <p id="tally"></p>
    </section>

    <!-- The route target. Three patterns live here: `/` is the placeholder,
         `/settings` is your account, and `/board/:id/*` is a board — a
         WILDCARD, so the board layout stays mounted while a card detail
         routes underneath it. routes() owns these children, so the markup
         lives in index.ts where each handler can build it under its own
         dispose scope. The board list above stays put: list beside detail,
         not list THEN detail. -->
    <main id="view"></main>

    <dialog id="auth">
      <form method="dialog">
        <h2>sign in</h2>
        <input id="auth-name" placeholder="name (register only)" autocomplete="name" />
        <input id="auth-email" type="email" placeholder="email" autocomplete="username webauthn" />
        <input id="auth-password" type="password" placeholder="password" autocomplete="current-password" />
        <p id="auth-error"></p>
        <div class="auth-actions">
          <button id="auth-login">log in</button>
          <button id="auth-register">register</button>
        </div>
        <button id="auth-passkey" hidden>use a passkey</button>
      </form>
    </dialog>

    <dialog id="confirm">
      <p id="confirm-message"></p>
      <form method="dialog" class="auth-actions">
        <button id="confirm-cancel" value="cancel">cancel</button>
        <button id="confirm-ok" value="ok">delete</button>
      </form>
    </dialog>

    <script type="module" src="./index.ts"></script>
  </body>
</html>
