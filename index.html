<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>epsilon-app</title>
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <h1>epsilon</h1>

    <section id="mine" hidden>
      <form id="board-form"><input id="new-board" placeholder="new board name, press enter" /></form>
      <ul id="boards"></ul>
    </section>

    <h2 id="board-name"></h2>
    <p id="who"></p>
    <form id="form"><input id="input" placeholder="type, press enter, watch the other tab" autofocus /></form>
    <ul id="log"></ul>

    <section id="share" hidden>
      <h3>members</h3>
      <form id="member-form"><input id="new-member" type="email" placeholder="share with an email, press enter" /></form>
      <ul id="members"></ul>
    </section>

    <dialog id="auth">
      <form method="dialog">
        <h2>sign in</h2>
        <input id="auth-name" placeholder="name (register only)" autocomplete="name" />
        <input id="auth-email" type="email" placeholder="email" autocomplete="email" />
        <input id="auth-password" type="password" placeholder="password" autocomplete="current-password" />
        <p id="auth-error"></p>
        <button id="auth-login">log in</button>
        <button id="auth-register">register</button>
      </form>
    </dialog>

    <script type="module" src="./index.ts"></script>
  </body>
</html>
